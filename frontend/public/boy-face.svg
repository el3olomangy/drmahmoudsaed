<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Boy avatar">
  <defs>
    <linearGradient id="bgBoy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FB4FF"/>
      <stop offset="1" stop-color="#3B62E0"/>
    </linearGradient>
    <linearGradient id="skinBoy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDCBC"/>
      <stop offset="1" stop-color="#EFB184"/>
    </linearGradient>
    <linearGradient id="hairBoy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C4632"/>
      <stop offset="1" stop-color="#33251A"/>
    </linearGradient>
    <linearGradient id="shirtBoy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F5FF"/>
      <stop offset="1" stop-color="#BFD2FF"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" fill="url(#bgBoy)"/>
  <ellipse cx="80" cy="150" rx="70" ry="40" fill="#000" opacity="0.06"/>
  <!-- shoulders / shirt -->
  <path d="M22 160 C22 120 48 106 80 106 C112 106 138 120 138 160 Z" fill="url(#shirtBoy)"/>
  <path d="M80 106 l-10 14 10 10 10 -10 z" fill="#ffffff" opacity="0.7"/>
  <!-- neck -->
  <path d="M69 94 h22 v12 c0 9 -22 9 -22 0 z" fill="#E6AE80"/>
  <!-- ears -->
  <circle cx="47" cy="70" r="8" fill="url(#skinBoy)"/>
  <circle cx="113" cy="70" r="8" fill="url(#skinBoy)"/>
  <!-- head -->
  <rect x="46" y="34" width="68" height="74" rx="34" fill="url(#skinBoy)"/>
  <!-- hair -->
  <path d="M45 72 C42 40 60 26 80 26 C100 26 118 40 115 72 C112 58 108 54 106 54 C100 46 92 48 80 48 C68 48 60 46 54 54 C52 54 48 58 45 72 Z" fill="url(#hairBoy)"/>
  <!-- eyebrows -->
  <rect x="59" y="63" width="15" height="3.5" rx="1.75" fill="#4A382A"/>
  <rect x="86" y="63" width="15" height="3.5" rx="1.75" fill="#4A382A"/>
  <!-- eyes -->
  <circle cx="66" cy="74" r="4.6" fill="#3A2C22"/>
  <circle cx="94" cy="74" r="4.6" fill="#3A2C22"/>
  <circle cx="67.6" cy="72.4" r="1.5" fill="#fff"/>
  <circle cx="95.6" cy="72.4" r="1.5" fill="#fff"/>
  <!-- nose -->
  <path d="M80 78 q3.5 6 -1 9.5" stroke="#DB9C6C" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <!-- mouth -->
  <path d="M69 92 Q80 100 91 92" stroke="#BE6E50" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="59" cy="86" r="5.5" fill="#FF9E80" opacity="0.35"/>
  <circle cx="101" cy="86" r="5.5" fill="#FF9E80" opacity="0.35"/>
  <!-- head highlight -->
  <ellipse cx="65" cy="55" rx="10" ry="7" fill="#fff" opacity="0.16"/>
</svg>
