<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Girl avatar">
  <defs>
    <linearGradient id="bgGirl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCA5D4"/>
      <stop offset="1" stop-color="#C6449B"/>
    </linearGradient>
    <linearGradient id="skinGirl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDCBC"/>
      <stop offset="1" stop-color="#EFB184"/>
    </linearGradient>
    <linearGradient id="hairGirl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E4A2E"/>
      <stop offset="1" stop-color="#3F2717"/>
    </linearGradient>
    <linearGradient id="shirtGirl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0F7"/>
      <stop offset="1" stop-color="#FFC7E4"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" fill="url(#bgGirl)"/>
  <ellipse cx="80" cy="150" rx="70" ry="40" fill="#000" opacity="0.06"/>
  <!-- back long hair -->
  <path d="M40 72 C38 40 58 24 80 24 C102 24 122 40 120 72 C120 96 118 116 110 132 C107 116 106 104 104 96 L104 72 C104 72 102 50 80 50 C58 50 56 72 56 72 L56 96 C54 104 53 116 50 132 C42 116 40 96 40 72 Z" fill="url(#hairGirl)"/>
  <!-- shoulders / shirt -->
  <path d="M22 160 C22 120 48 106 80 106 C112 106 138 120 138 160 Z" fill="url(#shirtGirl)"/>
  <!-- neck -->
  <path d="M69 94 h22 v12 c0 9 -22 9 -22 0 z" fill="#E6AE80"/>
  <!-- ears -->
  <circle cx="47" cy="72" r="8" fill="url(#skinGirl)"/>
  <circle cx="113" cy="72" r="8" fill="url(#skinGirl)"/>
  <!-- head -->
  <rect x="46" y="36" width="68" height="74" rx="34" fill="url(#skinGirl)"/>
  <!-- top hair cap (above the eyes) -->
  <path d="M43 74 C41 40 60 24 80 24 C100 24 119 40 117 74 C114 60 110 56 108 56 C102 48 92 50 80 50 C68 50 58 48 52 56 C50 56 46 60 43 74 Z" fill="url(#hairGirl)"/>
  <!-- eyebrows -->
  <rect x="59" y="65" width="15" height="3.4" rx="1.7" fill="#5A3B26"/>
  <rect x="86" y="65" width="15" height="3.4" rx="1.7" fill="#5A3B26"/>
  <!-- eyes -->
  <circle cx="66" cy="76" r="4.8" fill="#3A2C22"/>
  <circle cx="94" cy="76" r="4.8" fill="#3A2C22"/>
  <circle cx="67.6" cy="74.4" r="1.5" fill="#fff"/>
  <circle cx="95.6" cy="74.4" r="1.5" fill="#fff"/>
  <!-- nose -->
  <path d="M80 80 q3.2 5.5 -1 9" stroke="#DB9C6C" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- mouth -->
  <path d="M71 94 Q80 101 89 94" stroke="#D65C7A" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="59" cy="88" r="5.5" fill="#FF7FA8" opacity="0.4"/>
  <circle cx="101" cy="88" r="5.5" fill="#FF7FA8" opacity="0.4"/>
  <!-- hair bow -->
  <g transform="translate(113 46)">
    <path d="M0 0 L-9 -6 L-9 6 Z" fill="#FF5CA8"/>
    <path d="M0 0 L9 -6 L9 6 Z" fill="#FF5CA8"/>
    <circle r="3" fill="#FF87BE"/>
  </g>
  <!-- head highlight -->
  <ellipse cx="66" cy="58" rx="9" ry="6" fill="#fff" opacity="0.14"/>
</svg>
